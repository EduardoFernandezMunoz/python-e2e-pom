name: Python Selenium CI
permissions:
  checks: write
on:
  push:
    branches: [ master, fix/project-structure ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install selenium pytest pytest-html

      - name: Run tests and generate reports
        run: |
          cd POM_Practice
          pytest tests/ --html=report.html --self-contained-html --junitxml=results.xml
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: POM_Practice/report.html

      - name: Upload JUnit XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: POM_Practice/results.xml

      - name: Publish Test Results to GitHub
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Python Selenium Tests
          path: POM_Practice/results.xml
          reporter: junit